<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Capítulo 3 - Interação com a Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simulações de Investimento</h1>

    <div id="lista-simulacoes"></div>

    <form id="formulario-edicao" hidden>
        <h2>Editar simulação</h2>

        <input type="hidden" id="campo-id">

        <label for="campo-nome">Nome</label>
        <input type="text" id="campo-nome" required>

        <label for="campo-valor-inicial">Valor inicial (R$)</label>
        <input type="number" id="campo-valor-inicial" min="0" step="0.01" required>

        <div class="acoes-formulario">
            <button type="submit">Salvar</button>
            <button type="button" id="botao-cancelar">Cancelar</button>
        </div>
    </form>

    <script src="Simulacao.js"></script>
    <script src="script.js"></script>
</body>
</html>
