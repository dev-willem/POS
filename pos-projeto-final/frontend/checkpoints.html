<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoints</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <div class="topbar">
        <div class="marca">
            Sistema de Controle de Checkpoints
            <span class="escola">Escola Caminhos da Aventura</span>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="corridas.html">Corridas</a>
            <a href="professores.html">Professores</a>
            <a class="ativo" href="checkpoints.html">Checkpoints</a>
        </nav>
    </div>

    <div class="pagina">
        <div class="cabecalho-pagina">
            <div>
                <h1>Checkpoints cadastrados</h1>
                <p class="subtitulo">Cadastre os checkpoints de cada corrida e o professor responsável.</p>
            </div>
            <button id="novo-checkpoint" class="botao botao-primario" type="button">+ Novo checkpoint</button>
        </div>

        <p id="status" hidden></p>

        <section id="lista-checkpoints"></section>
    </div>

    <dialog id="modal-checkpoint">
        <form id="form-checkpoint">
            <h2 id="titulo-formulario">Novo checkpoint</h2>
            <input type="hidden" id="checkpoint-id">
            <div class="campo">
                <label for="checkpoint-numero">Número do checkpoint</label>
                <input type="number" id="checkpoint-numero" min="1" required>
            </div>
            <div class="campo">
                <label for="checkpoint-corrida">Corrida</label>
                <select id="checkpoint-corrida" required></select>
            </div>
            <div class="campo">
                <label for="checkpoint-professor">Professor responsável</label>
                <select id="checkpoint-professor" required></select>
            </div>
            <div class="barra-acoes">
                <button type="button" id="cancelar-checkpoint" class="botao botao-secundario">Cancelar</button>
                <button type="submit" class="botao botao-primario">Salvar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/checkpoints.js"></script>
</body>
</html>
